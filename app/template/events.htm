<div class="container my-3">
  <div class="card border-black">
    <h4 class="card-header bg-warning">RG2: 100 most recent events</h4>
    <div class="card-body">
      <table id='rg2-events-table' class="table table-striped" style="width:100%">
        <thead>
          <tr>
            <th>Date</th>
            <th></th>
            <th>Event</th>
            <th>Club</th>
            <th>Nat</th>
            <th>Courses</th>
            <th>Results</th>
            <th>Routes</th>
          </tr>
        </thead>
        <tbody>
          <repeat group="{{ @events }}" value="{{ @event }}">
            <tr>
              <td>{{ @event.date }}</td>
              <td {{ @event.georef === 1 ? "class='georef'": "" }}>
                {{ @event.georef === 1 ? "<img alt='globe' src='img/globe-24.png' />": "" }}
              </td>
              <td><a href="{{ @event.link }}#{{ @event.hasheventid }}" target="_blank" rel="noopener">{{ @event.name | raw}}</a></td>
              <td>{{ @event.club }}</td>
              <td>{{ @event.country }}</td>
              <td>{{ @event.courses }}</td>
              <td>{{ @event.results }}</td>
              <td>{{ @event.routes }}</td>
            </tr>
          </repeat>
        </tbody>
      </table>
    </div>
  </div>
</div>
