<div class="container my-3">
  <div class="card border-black">
    <h4 class="card-header bg-warning">RG2 sites</h4>
    <div class="card-body">
      <table
        id="rg2-sites-table"
        class="table table-striped"
        style="width: 100%"
      >
        <thead>
          <tr>
            <th>Club</th>
            <th>Country</th>
            <th>Events</th>
            <th>Courses</th>
            <th>Results</th>
            <th>Routes</th>
            <th>Latest event</th>
            <th>Date</th>
            <th></th>
          </tr>
        </thead>
        <tbody>
          <repeat group="{{ @sites }}" value="{{ @site }}">
            <tr>
              <td>
                <a href="{{ @site.link }}" target="_blank" rel="noopener"
                  >{{ @site.club }}</a
                >
              </td>
              <td>{{ @site.country }}</td>
              <td>{{ @site.events }}</td>
              <td>{{ @site.courses }}</td>
              <td>{{ @site.results }}</td>
              <td>{{ @site.routes }}</td>
              <td>
                <a
                  href="{{ @site.link }}#{{ @site.latesthasheventid }}"
                  target="_blank"
                  rel="noopener"
                  >{{@site.latesteventname | raw}}</a
                >
              </td>
              <td>{{ @site.latesteventdate }}</td>
              <td>
                <a
                  href="events/rss/{{ @site.abbr }}"
                  title="RSS feed for {{ @site.abbr }}"
                  class="rssfeed"
                  >&nbsp;&nbsp;&nbsp;&nbsp;</a
                >
              </td>
            </tr>
          </repeat>
        </tbody>
      </table>
    </div>
  </div>
</div>
